name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built from source, not installed from the latest release: this
      # boilerplate binds its listener with listen_on(host, port), which landed
      # after the newest tagged machin. Switch back to install.sh once a
      # release carries it.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build machin from source
        run: |
          git clone --depth 1 https://github.com/javimosch/machin /tmp/machin
          (cd /tmp/machin && go build -o machin .)
          mkdir -p "$HOME/.local/bin"
          cp /tmp/machin/machin "$HOME/.local/bin/machin"
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./boilerplate-cli-ui-machin version


      # The boilerplates are comparison instruments: they must all implement the
      # same contract, or comparing their binary sizes is meaningless. This
      # proves it instead of asserting it.
      - name: Build the conformance harness
        run: |
          git clone --depth 1 https://github.com/javimosch/cli-spec-conformance /tmp/csc
          (cd /tmp/csc && ./build.sh)

      - name: Spec conformance
        run: /tmp/csc/cli-spec-conformance check ./boilerplate-cli-ui-machin --specs output,guide,daemon

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./boilerplate-cli-ui-machin version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
